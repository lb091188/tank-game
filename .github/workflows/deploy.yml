# 部署到 GitHub Pages: 推送 main 分支 → 自动把 client/ 发布到 gh-pages 分支
# (Pages 已以 gh-pages 分支模式开通; 首次开通即由本仓库 gh-pages 分支触发)
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Stamp version (commit time, seconds precision)
        run: |
          git log -1 --format=%cI > client/version.txt
          # 资源 URL 盖版本戳: GitHub Pages 默认缓存 10 分钟, 不破缓存会跑到旧 JS
          V=$(cat client/version.txt)
          sed -i "s|src=\"js/\([^\"?]*\)\"|src=\"js/\1?v=\${V//:/_}\"|g" client/index.html

      - name: Publish client/ → gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./client
          force_orphan: true   # gh-pages 保持单提交快照, 不累积历史
