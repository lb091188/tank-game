# 部署到 GitHub Pages: 推送 main 分支即自动发布 client/ 目录
# 依赖: 仓库 Settings → Pages → Build and deployment → Source 选择 "GitHub Actions"
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true   # 仓库未开通 Pages 时自动创建(需 pages:write 权限, 上方已声明)

      - name: Upload client (游戏本体, 资产全为相对路径可直接子路径部署)
        uses: actions/upload-pages-artifact@v3
        with:
          path: client

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
